# Alembic configuration — jobfucker storage migrations.
#
# This file lives beside `env.py` and the `versions/` directory under
# src/jobfucker/storage/migrations/. Run from the project root with:
#
#   uv run alembic -c src/jobfucker/storage/migrations/alembic.ini upgrade head
#
# The DB URL is taken from the `JOBFUCKER_DB_URL` env var when set (see env.py),
# falling back to `sqlalchemy.url` below. The initial revision is generated from
# the declarative models in src/jobfucker/storage/models.py (Base.metadata).
[alembic]
# Resolve relative to THIS ini file (src/jobfucker/storage/migrations), so the
# command works from any cwd with `-c <path>/alembic.ini`.
script_location = %(here)s
prepend_sys_path = %(here)s
path_separator = os
# Default target DB (a file next to this ini). Override at runtime via
# JOBFUCKER_DB_URL (tests point at a tmp file DB).
sqlalchemy.url = sqlite:///%(here)s/jobfucker.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
