<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Движок jobfucker: четыре этапа</title>
  <desc id="wf-desc">Цепочка этапов движка: fetch — поисковые запросы hh.ru в локальную БД; score — AI-оценка под резюме; generate — сопроводительное под вакансию; apply — отклик с решением капчи и тестов.</desc>

  <rect width="1200" height="300" rx="20" fill="#0a0d10"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="none" stroke="#232b33"/>

  <text x="64" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="1.4" fill="#58a6ff">ДВИЖОК &#183; ЧЕТЫРЕ ЭТАПА</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g id="stage-fetch">
      <rect x="64" y="92" width="250" height="152" rx="14" fill="#11161b" stroke="#232b33"/>
      <text x="86" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6e7b89">01</text>
      <text x="86" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#e6edf3">fetch</text>
      <text x="86" y="200" font-size="18" fill="#8b98a5">поисковые запросы hh.ru</text>
      <text x="86" y="224" font-size="18" fill="#8b98a5">&#8594; локальная БД</text>
    </g>

    <text x="315" y="175" font-size="22" fill="#58a6ff">&#8594;</text>

    <g id="stage-score">
      <rect x="338" y="92" width="250" height="152" rx="14" fill="#11161b" stroke="#232b33"/>
      <text x="360" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6e7b89">02</text>
      <text x="360" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#e6edf3">score</text>
      <text x="360" y="200" font-size="18" fill="#8b98a5">AI-оценка под резюме</text>
      <text x="360" y="224" font-size="18" fill="#8b98a5">&#8594; сортировка</text>
    </g>

    <text x="589" y="175" font-size="22" fill="#58a6ff">&#8594;</text>

    <g id="stage-generate">
      <rect x="612" y="92" width="250" height="152" rx="14" fill="#11161b" stroke="#232b33"/>
      <text x="634" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6e7b89">03</text>
      <text x="634" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#e6edf3">generate</text>
      <text x="634" y="200" font-size="18" fill="#8b98a5">Сопроводительное</text>
      <text x="634" y="224" font-size="18" fill="#8b98a5">под вакансию</text>
    </g>

    <text x="863" y="175" font-size="22" fill="#58a6ff">&#8594;</text>

    <g id="stage-apply">
      <rect x="886" y="92" width="250" height="152" rx="14" fill="#11161b" stroke="#232b33"/>
      <text x="908" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6e7b89">04</text>
      <text x="908" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#e6edf3">apply</text>
      <text x="908" y="200" font-size="18" fill="#8b98a5">отклик + решение капчи</text>
      <text x="908" y="224" font-size="18" fill="#8b98a5">+ решение тестов</text>
    </g>
  </g>
</svg>
