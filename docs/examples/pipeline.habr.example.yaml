# =============================================================================
# jobfucker — Habr Career pipeline (minimal example, no secrets)
# =============================================================================
# Один аккаунт Habr = одно резюме (id = alias). Отклики ограничены 150/месяц
#
# Читающие поиски (search_type: all) выполняются анонимно и не требуют логина;
# search_type: suitable требует авторизованной сессии.
# yaml-language-server: $schema=https://raw.githubusercontent.com/stone-w4tch3r/jobfucker/master/docs/schemas/pipeline.schema.json

name: "habr-python"
description: "Python developer bank on Habr Career (example)"

service:
  habr:
    captcha_max_attempts: 4
    # ВАЖНО: это просто пример! Поисковый пул проектируется под свой профиль.
    searches:
      - query: "python"
        search_type: "all"
        filter:
          sort: "date"
          qualification: "middle"
          remote: true
          salary_from: 200000
          salary_currency: "rur"
          skills: [446]
          locations: ["c_678"]
          employment: "full_time"

# --- Credentials (файлы относительно этого yaml; никогда не коммить секреты) ---
auth:
  login_file: "secrets/login.txt"
  password_file: "secrets/password.txt"

# --- Resume -------------------------------------------------------------------
resume:
  path: "../resumes/resume.md"

# --- OpenAI: скоринг и сопроводительные ---------------------------------------
openai:
  model: "gpt-5-mini"
  base_url: "https://api.openai.com/v1"
  api_key_file: "secrets/api_key.txt"

# --- AI scoring ---------------------------------------------------------------
scoring:
  min_required_score: 3
  scoring_prompt_file: "prompts/scoring.md.j2"

# --- Cover letter -------------------------------------------------------------
apply:
  apply_prompt_file: "prompts/apply.md.j2"

# --- Limits -------------------------------------------------------------------
# apply_limit's window follows the client's quota period (Habr = per calendar month).
limits:
  apply_limit: 50
