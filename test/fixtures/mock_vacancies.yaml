# Canonical canned mock vacancies for the jobfucker test suite.
#
# The mock client returns exactly whatever `service.mock.vacancies` carries; the
# shared pipeline helper and the mock-client unit tests load THIS file so the
# test contract is never re-inlined in Python. Consumers (edit this file, keep
# them in sync):
#   - test/pipeline_helpers.py        -> mock_vacancies() -> build_pipeline_config / make_factory
#   - test/clients/mock/test_mock_client.py   -> the section-based search/apply tests
#
# test/fixtures/pipeline.mock.yaml.j2 mirrors the same three entries inline into
# the hermetic CLI config (a Jinja fragment cannot be included at the deep
# `service.mock.vacancies` indent without mangling the YAML). The repo demo
# `pipelines/pipeline.mock.yaml` carries the same entries as its example.
- external_id: "mock-1"
  title: "Python Backend Developer (Mock)"
  url: "https://mock.example/vacancies/python-backend-1"
  company: "MockCorp"
  description: |
    We are looking for a Python backend developer to build distributed services.

    Responsibilities:
    - Design and implement REST APIs with FastAPI;
    - Work with PostgreSQL and Redis;
    - Containerise services with Docker;
    - Collaborate with frontend and QA teams.

    Requirements:
    - 3+ years of Python experience;
    - Strong knowledge of async programming (asyncio);
    - Experience with SQLAlchemy;
    - English at reading level.

    We offer remote work, a modern tech stack and a friendly team.
  key_skills: ["Python", "FastAPI", "PostgreSQL", "Docker", "SQLAlchemy"]
  salary:
    from: 250000
    to: 350000
    currency: "RUR"
    gross: false
